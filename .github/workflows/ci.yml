name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Swift version
        run: swift --version
      - name: Test
        shell: bash
        run: swift test --parallel --enable-code-coverage 2>&1 | tee test.log
      - name: No compiler warnings in the library modules
        # The library targets build with complete strict concurrency checking (Package.swift).
        # Any warning from their sources, concurrency or not, fails the job. RaysApp, LinkBridge
        # and the vendored Link SDK are not checked here.
        if: success() || failure()
        shell: bash
        run: |
          pattern='Sources/Rays(Output|Tempo|Core|Control|Engine)/[^:]+\.swift:[0-9]+:[0-9]+: warning:'
          if grep -E "$pattern" test.log | sort -u > library-warnings.txt && [ -s library-warnings.txt ]; then
            cat library-warnings.txt
            echo "::error::$(wc -l < library-warnings.txt | tr -d ' ') compiler warning(s) in the library modules (listed above)."
            exit 1
          fi
          echo "No compiler warnings in RaysOutput, RaysTempo, RaysCore, RaysControl, RaysEngine."
      - name: Coverage summary
        # Line coverage per module, printed in the log and in the run's summary page. No external service.
        run: Scripts/coverage-summary.sh

  app:
    # Builds RAYS.app without the Beat Link helper so every change yields a runnable app.
    # Download it from the run's Artifacts (Pro DJ Link is disabled in this build).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build RAYS.app
        run: Scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/RAYS.app dist/RAYS-${{ github.sha }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RAYS-app
          path: dist/RAYS-*.zip
          retention-days: 14
