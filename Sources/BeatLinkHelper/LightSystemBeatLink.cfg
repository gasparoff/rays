[Application]
app.classpath=$APPDIR/classes:$APPDIR/beat-link-trigger.jar
app.mainclass=LightSystemBeatLink

[JavaOptions]
java-options=-Djava.awt.headless=true
java-options=-Xms8m
java-options=-Xmx48m
java-options=-XX:+UseSerialGC
java-options=-XX:ReservedCodeCacheSize=32m
java-options=-XX:TieredStopAtLevel=1
