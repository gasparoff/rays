name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test --parallel --enable-code-coverage
      - name: Coverage summary
        # Line coverage per module, printed in the log and in the run's summary page. No external service.
        run: Scripts/coverage-summary.sh

  app:
    # Builds RAYS.app without the Beat Link helper so every change yields a runnable app.
    # Download it from the run's Artifacts (Pro DJ Link is disabled in this build).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build RAYS.app
        run: Scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/RAYS.app dist/RAYS-${{ github.sha }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RAYS-app
          path: dist/RAYS-*.zip
          retention-days: 14
