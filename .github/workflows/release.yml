name: Release

# Push a tag like v2.0.0 to publish a GitHub release with RAYS.app (Apple silicon).
# "Run workflow" on main builds the same zip as an artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # build provenance attestation
      attestations: write
    env:
      # Beat Link Trigger release whose runtime powers Pro DJ Link (EPL-2.0). Pinned for reproducible
      # builds: when you update the tag, update the SHA-256 of its Apple silicon DMG too.
      BEAT_LINK_TRIGGER_TAG: v8.0.0
      BEAT_LINK_TRIGGER_DMG: Beat-Link-Trigger-8.0.0-MacOS.dmg
      BEAT_LINK_TRIGGER_SHA256: 31b53cad22f15c515f33065b0a0a4fa62af5ea6c1e8b6f9174931c23bfb0f3e5
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Fetch Beat Link Trigger
        run: |
          mkdir -p "$RUNNER_TEMP/blt"
          gh release download "$BEAT_LINK_TRIGGER_TAG" --repo Deep-Symmetry/beat-link-trigger \
            --pattern "$BEAT_LINK_TRIGGER_DMG" --dir "$RUNNER_TEMP/blt"
          dmg="$RUNNER_TEMP/blt/$BEAT_LINK_TRIGGER_DMG"
          # Never mount or ship a runtime that differs from the pinned one.
          echo "$BEAT_LINK_TRIGGER_SHA256  $dmg" | shasum -a 256 -c -
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/blt/mnt" "$dmg"
          cp -R "$RUNNER_TEMP/blt/mnt/Beat Link Trigger.app" "$RUNNER_TEMP/Beat Link Trigger.app"
          hdiutil detach "$RUNNER_TEMP/blt/mnt"

      - name: Bootstrap
        run: BEAT_LINK_TRIGGER_APP="$RUNNER_TEMP/Beat Link Trigger.app" Scripts/bootstrap.sh

      - name: Test
        run: swift test --parallel

      - name: Build RAYS.app
        env:
          RAYS_VERSION: ${{ steps.version.outputs.version }}
          RAYS_REQUIRE_BEATLINK: "1"
        run: Scripts/build-app.sh

      - name: Zip
        run: |
          zip="dist/RAYS-${{ steps.version.outputs.version }}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/RAYS.app "$zip"
          shasum -a 256 "$zip" | tee "$zip.sha256"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: RAYS-release
          path: dist/RAYS-*.zip*

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed.

          **Install:** unzip, move RAYS.app to Applications and open it. This build is not notarized yet:
          the first time, macOS blocks it. Open System Settings → Privacy & Security and click **Open Anyway**.

          Requires macOS 14+ on Apple silicon. Pro DJ Link uses Beat Link from ${BEAT_LINK_TRIGGER_DMG} (EPL-2.0).
          The app includes Ableton Link and is distributed under the GPL v2 or later; source: this repository at ${GITHUB_REF_NAME}.

          **Verify:** the zip has a SHA-256 file and a build provenance attestation:
          \`gh attestation verify $(basename "$ZIP") --repo ${GITHUB_REPOSITORY}\`
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "RAYS ${{ steps.version.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
