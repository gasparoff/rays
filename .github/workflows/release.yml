name: Release

# Push a tag like v2.0.0 to publish a GitHub release with RAYS.app (Apple silicon).
# "Run workflow" on main builds the same zip as an artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # build provenance attestation
      attestations: write
    env:
      # Beat Link Trigger release whose runtime powers Pro DJ Link (EPL-2.0). Pinned for reproducible
      # builds: when you update the tag, update the SHA-256 of its Apple silicon DMG too.
      BEAT_LINK_TRIGGER_TAG: v8.0.0
      BEAT_LINK_TRIGGER_DMG: Beat-Link-Trigger-8.0.0-MacOS.dmg
      BEAT_LINK_TRIGGER_SHA256: 31b53cad22f15c515f33065b0a0a4fa62af5ea6c1e8b6f9174931c23bfb0f3e5
      GH_TOKEN: ${{ github.token }}
      # Developer ID signing and notarization run only when the repository has these secrets
      # (see docs/releasing.md). Without them the app is signed ad hoc, as before.
      SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Fetch Beat Link Trigger
        run: |
          mkdir -p "$RUNNER_TEMP/blt"
          gh release download "$BEAT_LINK_TRIGGER_TAG" --repo Deep-Symmetry/beat-link-trigger \
            --pattern "$BEAT_LINK_TRIGGER_DMG" --dir "$RUNNER_TEMP/blt"
          dmg="$RUNNER_TEMP/blt/$BEAT_LINK_TRIGGER_DMG"
          # Never mount or ship a runtime that differs from the pinned one.
          echo "$BEAT_LINK_TRIGGER_SHA256  $dmg" | shasum -a 256 -c -
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/blt/mnt" "$dmg"
          cp -R "$RUNNER_TEMP/blt/mnt/Beat Link Trigger.app" "$RUNNER_TEMP/Beat Link Trigger.app"
          hdiutil detach "$RUNNER_TEMP/blt/mnt"

      - name: Bootstrap
        run: BEAT_LINK_TRIGGER_APP="$RUNNER_TEMP/Beat Link Trigger.app" Scripts/bootstrap.sh

      - name: Test
        run: swift test --parallel

      - name: Import the Developer ID certificate
        if: env.SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then echo "No Developer ID Application identity in the certificate." >&2; exit 1; fi
          echo "RAYS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build RAYS.app
        env:
          RAYS_VERSION: ${{ steps.version.outputs.version }}
          RAYS_REQUIRE_BEATLINK: "1"
        run: Scripts/build-app.sh

      - name: Notarize and staple
        if: env.SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          ditto -c -k --sequesterRsrc --keepParent dist/RAYS.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          rm -f "$key"
          status="$(plutil -extract status raw "$RUNNER_TEMP/notary.json" 2>/dev/null || python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")"
          if [ "$status" != "Accepted" ]; then echo "Notarization status: $status" >&2; exit 1; fi
          xcrun stapler staple dist/RAYS.app
          spctl --assess --type execute --verbose=2 dist/RAYS.app

      - name: Remove the signing keychain
        if: always() && env.SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Zip
        run: |
          zip="dist/RAYS-${{ steps.version.outputs.version }}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/RAYS.app "$zip"
          shasum -a 256 "$zip" | tee "$zip.sha256"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RAYS-release
          path: dist/RAYS-*.zip*

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$SIGNING" = "true" ]; then
            INSTALL_NOTE="The app is signed with a Developer ID and notarized by Apple."
          else
            INSTALL_NOTE="This build is not notarized: the first time, macOS blocks it. Open System Settings → Privacy & Security and click **Open Anyway**."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed.

          **Install:** unzip, move RAYS.app to Applications and open it.
          ${INSTALL_NOTE}

          Requires macOS 14+ on Apple silicon. Pro DJ Link uses Beat Link from ${BEAT_LINK_TRIGGER_DMG} (EPL-2.0).
          The app includes Ableton Link and is distributed under the GPL v2 or later; source: this repository at ${GITHUB_REF_NAME}.

          **Verify:** the zip has a SHA-256 file and a build provenance attestation:
          \`gh attestation verify $(basename "$ZIP") --repo ${GITHUB_REPOSITORY}\`
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "RAYS ${{ steps.version.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
