name: Release drafter

on:
  push:
    branches: [main]
  # Labels pull requests from the paths they change (autolabeler in release-drafter.yml).
  # pull_request_target so fork PRs get labels too; this workflow never checks out or runs PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # update the draft release (push to main only)
      pull-requests: write   # add labels (pull requests only)
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
        with:
          disable-releaser: ${{ github.event_name != 'push' }}
          disable-autolabeler: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
